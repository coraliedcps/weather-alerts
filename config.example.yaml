# Copiez ce fichier en config.yaml puis adaptez-le.

# Le serveur ntfy, le canal et le jeton se règlent dans .env (NTFY_URL, NTFY_TOPIC,
# NTFY_TOKEN), comme pour commute-alerts. Ils peuvent aussi être mis ici
# (ntfy_server, ntfy_topic, ntfy_token), mais .env reste prioritaire.

emplacements:
  - nom: "Tambobo Bay"
    lat: 9.07
    lon: 123.12
    seuil_rafales_kts: 35     # alerte si rafales prévues >= ce seuil
    rayon_cyclone_km: 500     # alerte si un cyclone passe à moins de X km
    province: "Negros Oriental"   # signaux PAGASA (orthographe des bulletins, en anglais)
    seuil_signal_pagasa: 1        # alerte dès le signal n° 1
  - nom: "Dumaguete"
    lat: 9.31
    lon: 123.31
    seuil_rafales_kts: 35
    rayon_cyclone_km: 500
    province: "Negros Oriental"
    seuil_signal_pagasa: 1

# Pour un emplacement hors des Philippines : pas de « province » (PAGASA), et
# ajoutez fuseau: "Zone/Ville" (ex. "America/Adak") pour l'heure locale des messages.

# --- Réglages facultatifs (valeurs par défaut) ---
# intervalle_minutes: 60       # un passage toutes les 60 min
# horizon_heures: 120          # 5 jours de prévision
# rayon_urgence_km: 200        # cyclone plus proche -> notification urgente
# fuseau: "Asia/Manila"        # fuseau du contrôle quotidien
# heure_controle: 8            # heure locale du « Surveillance OK — RAS »
# marge_fin_kts: 2             # fin d'alerte quand rafales < seuil - 2 (évite les va-et-vient)
# escalade_rafales_kts: 5      # nouvelle notif si les rafales gagnent 5 kts
# escalade_cyclone_km: 50      # nouvelle notif si le cyclone se rapproche de 50 km
