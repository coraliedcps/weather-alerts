name: Surveillance météo

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min (décalé des :00/:30, très chargés chez GitHub)
  workflow_dispatch:           # lancement manuel depuis l'onglet Actions

permissions:
  contents: write              # pour enregistrer state.json

concurrency:
  group: weather-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vérification vent + cyclones
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python weather_alerts.py
      - name: Enregistrer l'état
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "weather-alerts[bot]"
            git config user.email "weather-alerts@users.noreply.github.com"
            git add state.json
            git commit -m "état $(date -u +%FT%TZ)"
            git pull --rebase -q || true
            git push
          fi
